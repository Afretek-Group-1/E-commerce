<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storefront | Mercado Marketplace</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-900 min-h-screen flex flex-col antialiased">

  <header class="bg-white border-b border-neutral-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded bg-neutral-950 text-white font-black flex items-center justify-center text-sm">M</div>
        <span class="text-base font-bold text-neutral-950">Mercado</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="/" class="text-xs font-semibold text-neutral-600 hover:text-neutral-950">
          ← All Marketplace Stores
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1 space-y-8">
    
    <!-- Store Header Card -->
    <div class="bg-white p-6 rounded-2xl border border-neutral-200 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <h1 id="storeTitle" class="text-2xl font-black text-neutral-950">Loading Store...</h1>
          <span class="bg-neutral-100 text-neutral-700 text-[10px] font-bold px-2 py-0.5 rounded">Independent Vendor</span>
        </div>
        <p id="storeOwner" class="text-xs text-neutral-500 mt-1">Managed by —</p>
      </div>
      <div class="text-xs text-neutral-600">
        <span id="storeLocation">📍 Location: —</span>
      </div>
    </div>

    <!-- Store Products -->
    <div>
      <h2 class="text-base font-bold text-neutral-950 mb-4">Inventory from this Seller</h2>
      <div id="storeProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Injected by JS -->
      </div>
    </div>

  </main>

  <script>
    const sellerId = "{{ seller_id }}";

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch(`/api/sellers/${sellerId}`);
        const seller = await res.json();

        document.getElementById('storeTitle').textContent = seller.store_name;
        document.getElementById('storeOwner').textContent = `Managed by ${seller.owner_name} • Member since ${seller.created_at.split(' ')[0]}`;
        document.getElementById('storeLocation').textContent = `📍 ${seller.location}`;

        const grid = document.getElementById('storeProductsGrid');
        if (seller.products.length === 0) {
          grid.innerHTML = '<p class="text-xs text-neutral-400 py-12 col-span-4 text-center">This vendor has no active listings currently.</p>';
        } else {
          grid.innerHTML = seller.products.map(p => `
            <a href="/?q=${encodeURIComponent(p.title)}" class="bg-white rounded-2xl border border-neutral-200 overflow-hidden hover:border-neutral-400 transition-colors flex flex-col group">
              <div class="h-48 bg-neutral-100 overflow-hidden">
                <img src="${p.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition-transform" />
              </div>
              <div class="p-4 flex-1 flex flex-col justify-between space-y-2">
                <div>
                  <span class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider">${p.category}</span>
                  <h3 class="font-bold text-sm text-neutral-950">${p.title}</h3>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-neutral-100">
                  <span class="text-base font-bold text-neutral-950">$${p.price.toFixed(2)}</span>
                  <span class="text-xs text-neutral-600 underline">View in Marketplace →</span>
                </div>
              </div>
            </a>
          `).join('');
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>

</body>
</html>
